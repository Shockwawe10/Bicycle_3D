# Varsen landing: nginx server block (drop into /etc/nginx/conf.d/ and adjust server_name/root).
# Files: index.html (self-contained: inline CSS/JS/fonts) + vendor/three@0.185.1/*.js (pinned, immutable).
# qa/serve.mjs mimics these headers locally; qa/csp.mjs regenerates the CSP hashes after any edit of index.html.

map $uri $varsen_cache {
    default                "no-cache";                              # HTML: always revalidate (ETag)
    ~^/vendor/             "public, max-age=31536000, immutable";   # version-pinned path, never changes
}

server {
    listen 80;
    listen [::]:80;
    server_name varsen.example;
    root /var/www/varsen;
    index index.html;
    charset utf-8;

    # compression: text assets only (woff2 fonts are inline; png not used)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    # brotli on; brotli_types text/css text/javascript application/javascript;   # if ngx_brotli is installed

    # one add_header set at server level (location blocks with their own add_header would drop these)
    add_header Cache-Control $varsen_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # CSP-BEGIN (generated by qa/csp.mjs; do not edit by hand)
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-qMa9Y6cjWyLAXxLt7UegL9Rh1yGzafCfWcfFnGcdmFw=' 'sha256-kW1IQ2ZQhXbhEbhD/1gDq3BOVEjYpQe6Gps6YML0BCs='; style-src 'self' 'sha256-o1LkURpxUovD9Ym70lrlndx4S6neY6Vay8SgRYBsvT0=' 'sha256-lPwlBYZwHERQHrh1wEzx1TtgLZevfhRLmsoH1yYDk/A='; img-src 'self' data:; font-src data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    # CSP-END

    # ES modules must be served as JavaScript (nginx's default mime.types maps .js to application/javascript)
    location ^~ /vendor/ {
        try_files $uri =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }

    # never serve the QA/dev folders if the whole repo is deployed by mistake
    location ~ ^/(qa|node_modules|\.git|\.claude|\.taste-skill)(/|$) {
        return 404;
    }
}
