<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>html,body{margin:0;background:#fff}canvas{display:block;width:300px;height:300px}</style>
<canvas id="c"></canvas>
<script>
const q = new URLSearchParams(location.search), c = document.getElementById('c');
const gl = c.getContext('webgl2', { antialias: q.has('aa'), alpha: q.has('alpha') });
const draw = (r, g, b) => { gl.viewport(0, 0, c.width, c.height); gl.clearColor(r, g, b, 1); gl.clear(gl.COLOR_BUFFER_BIT); };
c.width = c.height = 450; draw(1, 0, 0);                                   // red at first size
window.resizeAndDraw = () => new Promise(res => requestAnimationFrame(() => { c.width = c.height = 375; draw(0, 0.6, 0); res(); }));  // green after resize
</script>
